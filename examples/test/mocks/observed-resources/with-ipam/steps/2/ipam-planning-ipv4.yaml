apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPCIpamPool
metadata:
  namespace: infra
  name: with-ipam-ipv4-planning
  annotations:
    crossplane.io/composition-resource-name: ipam-planning-ipv4
    gotemplating.fn.crossplane.io/composition-resource-name: ipam-planning-ipv4
status:
  conditions:
  - type: Ready
    status: "True"
  - type: Synced
    status: "True"
  atProvider:
