apiVersion: aws.hops.ops.com.ai/v1alpha1
kind: Network
metadata:
  name: with-ipam
  namespace: infra
spec:
  providerConfigRef:
    name: default
  region: us-east-1
  tags:
    Environment: production
    Team: platform

  # Use IPAM to allocate VPC CIDR from pool
  # Subnet CIDRs are calculated automatically using cidrmath
  ipam:
    ipv4:
      enabled: true
      # Pool ID from aws-ipam status
      poolId: ipam-pool-0123456789abcdef0
      netmaskLength: 16
    ipv6Gua:
      enabled: true
      # Regional Amazon-provided GUA pool; allocate one /56 to this VPC
      poolId: ipam-pool-0fedcba9876543210
      netmaskLength: 56

  # These are VPC resource-planning pools whose source resource is this VPC.
  # They are not the regional pools above.
  subnetLayout:
    ipv4PoolId: ipam-pool-vpc-ipv4-0123456789abcdef0
    ipv6PoolId: ipam-pool-vpc-ipv6-0123456789abcdef0
    ipv6NetmaskLength: 64
    availabilityZones:
    - a
    - b
    - c
    public:
      enabled: true
      netmaskLength: 24
    private:
      enabled: true
      netmaskLength: 20

  # VPC config (cidr will come from IPAM allocation)
  vpc: {}

  nat:
    enabled: true
    strategy: SingleAz
